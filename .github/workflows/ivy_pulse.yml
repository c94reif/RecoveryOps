name:   Ivy_Pulse

on:
  push:
    branches: [main]
    paths:
      - "my-extensions/ivy_pulse/**"
  pull_request:
    branches: [main]
    paths:
      - "my-extensions/ivy_pulse/**"

env:
  FLUTTER_VERSION: "3.44.1"
  WORKING_DIR: my-extensions/ivy_pulse

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Format & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get ${{ env.WORKING_DIR }}

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed  ${{ env.WORKING_DIR }}

      - name: Static analysis (fail on any issue, not just errors)
        run: flutter analyze ${{ env.WORKING_DIR }} --fatal-infos --fatal-warnings
  test:
    name:  Unit & Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: analyze
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Run tests
        run: flutter test --coverage 2>&1 | tee ${{ runner.temp }}/test.log
        continue-on-error: false
        id: tests

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

      - name: Upload failure logs
        if: steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-logs
          path: |
            ${{ runner.temp }}/analyze.log
            ${{ runner.temp }}/test.log
          retention-days: 14

      - name: Fail if steps failed
        if: steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1



  dependency-scan:
    name: Dependency Vulnerability Scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Google's open-source OSV-Scanner has native pub/pubspec.lock support.
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=pubspec.lock
            --recursive
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits in the diff/push

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep with community rulesets
        run: semgrep ci --config=auto
        env:
          SEMGREP_RULES: >-
            p/owasp-top-ten
            p/secrets
            p/dockerfile
        continue-on-error: true

  dependency-review:
    name: Dependency Review (PRs only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # GitHub's own open-source action: flags newly introduced vulnerable/
      # disallowed-license dependencies directly on the PR.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug 2>&1 | tee ${{ runner.temp }}/android-build.log
        continue-on-error: true
        id: build

      - name: Upload failure logs
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-logs
          path: ${{ runner.temp }}/android-build.log
          retention-days: 14

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows platform
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --debug 2>&1 | tee ${{ runner.temp }}/windows-build.log
        continue-on-error: true
        id: build

      - name: Upload failure logs
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-failure-logs
          path: ${{ runner.temp }}/windows-build.log
          retention-days: 14

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
