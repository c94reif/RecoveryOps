name: Recovery Ops CI

on:
  push:
    branches: [main]
    paths:
      - "my-extensions/recovery_ops/**"
      - "le_sdk/**"
  pull_request:
    branches: [main]
    paths:
      - "my-extensions/recovery_ops/**"
      - "le_sdk/**"

env:
  FLUTTER_VERSION: "3.41.7"
  WORKING_DIR: my-extensions/recovery_ops
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos 2>&1 | tee ${{ runner.temp }}/analyze.log
        continue-on-error: true
        id: analyze

      - name: Run tests
        run: flutter test 2>&1 | tee ${{ runner.temp }}/test.log
        continue-on-error: true
        id: tests

      - name: Upload failure logs
        if: steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-logs
          path: |
            ${{ runner.temp }}/analyze.log
            ${{ runner.temp }}/test.log
          retention-days: 14

      - name: Fail if steps failed
        if: steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --no-web-resources-cdn 2>&1 | tee ${{ runner.temp }}/web-build.log
        continue-on-error: true
        id: build

      - name: Upload failure logs
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-build-failure-logs
          path: ${{ runner.temp }}/web-build.log
          retention-days: 14

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug 2>&1 | tee ${{ runner.temp }}/android-build.log
        continue-on-error: true
        id: build

      - name: Upload failure logs
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-failure-logs
          path: ${{ runner.temp }}/android-build.log
          retention-days: 14

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows platform
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --debug 2>&1 | tee ${{ runner.temp }}/windows-build.log
        continue-on-error: true
        id: build

      - name: Upload failure logs
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-failure-logs
          path: ${{ runner.temp }}/windows-build.log
          retention-days: 14

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
