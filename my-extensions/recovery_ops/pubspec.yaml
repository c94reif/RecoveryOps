name: recovery_ops
description: Recovery Operations for Lattice Edge
version: 1.0.1
publish_to: 'none'

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  sqlite3: ^3.2.0
  path_provider: ^2.1.5
  path: ^1.9.1
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  flutter_map_cancellable_tile_provider: ^3.0.2
  latlong2: ^0.9.1
  speech_to_text: ^7.0.0
  uuid: ^4.5.1

  le_sdk:
    path: ../../le_sdk/packages/le_sdk
  flutter_plugin_android_lifecycle: ^2.0.34

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.32.0
  build_runner: ^2.13.0
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf

lattice_edge_extension:
  id: recovery_ops
  name: Recovery Ops
  description: Recovery Operations for Lattice Edge
  icon: extension
  display_mode: panel
