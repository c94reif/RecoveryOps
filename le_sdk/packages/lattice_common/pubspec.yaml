name: lattice_common
description: Shared types for Lattice Edge
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
        - asset: assets/fonts/inter/Inter-Italic-Variable.ttf
          style: italic
