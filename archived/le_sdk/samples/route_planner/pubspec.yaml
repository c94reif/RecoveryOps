name: route_planner
description: >
  Sample "Route Planner" extension for Lattice Edge.
  Demonstrates map APIs: pickLocation, addMarker, addPolyline, flyTo, and getMarkers.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  le_sdk:
    path: ../../packages/le_sdk
  lattice_common:
    path: ../../packages/lattice_common

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf

lattice_edge_extension:
  type: web
  entry: web/index.html
  icon: route
  display_mode: panel
  description: Plan multi-point routes with distance calculation
