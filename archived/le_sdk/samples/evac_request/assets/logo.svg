<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A1012"/>
      <stop offset="100%" style="stop-color:#1A0808"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CC2200"/>
      <stop offset="100%" style="stop-color:#991A00"/>
    </linearGradient>
    <linearGradient id="heli" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4C9A8"/>
      <stop offset="100%" style="stop-color:#B8A880"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Outer border - military stencil -->
  <rect x="16" y="16" width="480" height="480" rx="68" fill="none" stroke="#5A2020" stroke-width="4" stroke-dasharray="12,6"/>

  <!-- Danger stripes at top -->
  <clipPath id="topClip">
    <rect x="80" y="40" width="352" height="28" rx="4"/>
  </clipPath>
  <g clip-path="url(#topClip)">
    <rect x="80" y="40" width="352" height="28" fill="#FFD700"/>
    <line x1="80" y1="68" x2="108" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="108" y1="68" x2="136" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="136" y1="68" x2="164" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="164" y1="68" x2="192" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="192" y1="68" x2="220" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="220" y1="68" x2="248" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="248" y1="68" x2="276" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="276" y1="68" x2="304" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="304" y1="68" x2="332" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="332" y1="68" x2="360" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="360" y1="68" x2="388" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="388" y1="68" x2="416" y2="40" stroke="#1A0808" stroke-width="10"/>
    <line x1="416" y1="68" x2="444" y2="40" stroke="#1A0808" stroke-width="10"/>
  </g>

  <!-- Large medical cross -->
  <rect x="216" y="120" width="80" height="240" rx="8" fill="url(#cross)" stroke="#801A00" stroke-width="3"/>
  <rect x="136" y="200" width="240" height="80" rx="8" fill="url(#cross)" stroke="#801A00" stroke-width="3"/>

  <!-- Cross inner highlight -->
  <rect x="232" y="136" width="48" height="208" rx="4" fill="none" stroke="#FF4422" stroke-width="1" opacity="0.5"/>
  <rect x="152" y="216" width="208" height="48" rx="4" fill="none" stroke="#FF4422" stroke-width="1" opacity="0.5"/>

  <!-- Helicopter silhouette at top -->
  <!-- Main body -->
  <ellipse cx="256" cy="96" rx="40" ry="12" fill="url(#heli)"/>
  <!-- Tail boom -->
  <rect x="296" y="90" width="60" height="6" rx="2" fill="#B8A880"/>
  <!-- Tail rotor -->
  <rect x="352" y="80" width="4" height="26" rx="2" fill="#D4C9A8"/>
  <!-- Main rotor -->
  <line x1="176" y1="82" x2="336" y2="82" stroke="#D4C9A8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="82" r="4" fill="#8B7D3C"/>
  <!-- Skids -->
  <line x1="232" y1="108" x2="232" y2="116" stroke="#B8A880" stroke-width="2"/>
  <line x1="280" y1="108" x2="280" y2="116" stroke="#B8A880" stroke-width="2"/>
  <line x1="224" y1="116" x2="288" y2="116" stroke="#B8A880" stroke-width="2.5"/>

  <!-- MEDEVAC text -->
  <rect x="136" y="380" width="240" height="32" rx="4" fill="#1A0808" stroke="#5A2020" stroke-width="2"/>
  <text x="256" y="402" font-family="monospace" font-size="18" font-weight="bold" fill="#FFD700" text-anchor="middle" letter-spacing="6">MEDEVAC</text>

  <!-- Priority markers -->
  <circle cx="160" cy="440" r="12" fill="#CC2200" stroke="#801A00" stroke-width="2"/>
  <text x="160" y="445" font-family="monospace" font-size="14" font-weight="bold" fill="#FFD700" text-anchor="middle">U</text>

  <circle cx="216" cy="440" r="12" fill="#CC8800" stroke="#806600" stroke-width="2"/>
  <text x="216" y="445" font-family="monospace" font-size="14" font-weight="bold" fill="#FFD700" text-anchor="middle">P</text>

  <circle cx="272" cy="440" r="12" fill="#4A7A2A" stroke="#2A5A1A" stroke-width="2"/>
  <text x="272" y="445" font-family="monospace" font-size="14" font-weight="bold" fill="#FFD700" text-anchor="middle">R</text>

  <!-- Danger stripes at bottom -->
  <clipPath id="botClip">
    <rect x="80" y="468" width="352" height="28" rx="4"/>
  </clipPath>
  <g clip-path="url(#botClip)">
    <rect x="80" y="468" width="352" height="28" fill="#FFD700"/>
    <line x1="80" y1="496" x2="108" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="108" y1="496" x2="136" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="136" y1="496" x2="164" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="164" y1="496" x2="192" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="192" y1="496" x2="220" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="220" y1="496" x2="248" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="248" y1="496" x2="276" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="276" y1="496" x2="304" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="304" y1="496" x2="332" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="332" y1="496" x2="360" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="360" y1="496" x2="388" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="388" y1="496" x2="416" y2="468" stroke="#1A0808" stroke-width="10"/>
    <line x1="416" y1="496" x2="444" y2="468" stroke="#1A0808" stroke-width="10"/>
  </g>
</svg>
