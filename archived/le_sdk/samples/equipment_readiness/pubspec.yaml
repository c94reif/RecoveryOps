name: equipment_readiness
description: >
  Sample "Equipment Readiness" plugin for Lattice C2.
  Demonstrates logistics-style reporting with unit/site selection,
  equipment catalog browsing, multi-status entry, and peer messaging.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  le_sdk:
    path: ../../packages/le_sdk
  lattice_common:
    path: ../../packages/lattice_common

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/equipment_readiness_config.json
    - assets/logo.png

lattice_edge_extension:
  type: web
  entry: web/index.html
  icon: build
  display_mode: panel
  description: Report equipment readiness status (FMC/PMC/NMC)
